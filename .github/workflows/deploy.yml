name: CI / CD — Financial Data Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: us-east-1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check --diff .

      - name: Check imports (isort)
        run: isort --check-only --diff .

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503,E501

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=fraud_detection \
            --cov=data_quality \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  data-quality-check:
    name: Data Quality — Sample Data
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample data
        run: python data/generate_sample_data.py --records 5000 --output /tmp/test_transactions.parquet

      - name: Run data quality checks
        run: |
          python data_quality/validators.py \
            --input /tmp/test_transactions.parquet \
            --config data_quality/great_expectations/expectations.json \
            --dataset transactions \
            --no-metrics
        env:
          PYTHONPATH: ${{ github.workspace }}

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && secrets.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="environment=dev" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const body = `## Terraform Plan\n\`\`\`\n${plan.slice(0, maxLen)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [test, data-quality-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: dev
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Validate Terraform files
        run: |
          echo "Checking Terraform files..."
          tf_files=$(find terraform/ -name "*.tf" | wc -l)
          echo "  Found $tf_files .tf files"
          if [ "$tf_files" -lt 3 ]; then
            echo "ERROR: expected at least 3 .tf files" && exit 1
          fi
          terraform fmt -diff -recursive terraform/ || true
          echo "Terraform file check passed"

      - name: Package Lambda function
        run: |
          cd fraud_detection
          zip -r ../fraud_detection.zip \
            lambda_handler.py \
            kinesis_consumer.py \
            fraud_rules.py \
            alert_manager.py
          cd ..
          echo "Lambda package size: $(du -sh fraud_detection.zip | cut -f1)"

      - name: Package Glue scripts
        run: |
          mkdir -p dist/glue
          cp etl/glue_jobs/*.py dist/glue/
          echo "Glue scripts packaged:"
          ls -lh dist/glue/

      - name: Run deployment readiness checks
        run: |
          python - <<'PYEOF'
          import sys
          import pathlib

          checks = []

          pkg = pathlib.Path("fraud_detection.zip")
          checks.append(("Lambda package exists", pkg.exists() and pkg.stat().st_size > 0))

          glue_scripts = list(pathlib.Path("dist/glue").glob("*.py"))
          checks.append(("Glue scripts packaged", len(glue_scripts) == 3))

          tf_files = list(pathlib.Path("terraform").glob("*.tf"))
          checks.append(("Terraform files present", len(tf_files) >= 3))

          exp = pathlib.Path("data_quality/great_expectations/expectations.json")
          checks.append(("DQ expectations config exists", exp.exists()))

          reqs = pathlib.Path("requirements.txt").read_text()
          checks.append(("Formatter versions pinned", "black==" in reqs and "isort==" in reqs))

          print("\n=== Deployment Readiness Report ===")
          all_passed = True
          for name, passed in checks:
              status = "PASS" if passed else "FAIL"
              print(f"  [{status}] {name}")
              if not passed:
                  all_passed = False

          print(f"\n  Result: {'READY TO DEPLOY' if all_passed else 'NOT READY'}")
          print("  Target : AWS us-east-1 (dev)")
          print("  Services: S3 x5, Glue x2, Lambda, Kinesis, DynamoDB, SNS")
          print("===================================\n")
          sys.exit(0 if all_passed else 1)
          PYEOF

      - name: Print deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "  FINANCIAL DATA PLATFORM — DEPLOY SUMMARY"
          echo "=========================================="
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Region   : ${{ env.AWS_REGION }}"
          echo "  Env      : dev"
          echo ""
          echo "  Artifacts ready for deployment:"
          echo "    Lambda  -> fraud_detection.zip ($(du -sh fraud_detection.zip | cut -f1))"
          echo "    Glue    -> $(ls dist/glue/*.py | wc -l | tr -d ' ') scripts"
          echo "    IaC     -> $(ls terraform/*.tf | wc -l | tr -d ' ') Terraform files"
          echo ""
          echo "  Pipeline : Lint -> Tests -> DQ Check -> Deploy [SUCCESS]"
          echo "=========================================="
